<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTACT | Serotonin Production</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="logo"><span class="hole"></span>Serotonin Production</a>
    <div class="navlinks">
      <a href="index.html">TOP</a>
      <a href="production.html">PRODUCTION</a>
      <a href="craft.html">CRAFT</a>
      <a href="dye.html">DYE</a>
      <a href="rework.html">REWORK</a>
      <a href="contact.html" class="active">CONTACT</a>
      <a href="shop.html">SHOP</a>
      <a href="contact.html" class="cta">お問い合わせ</a>
    </div>
  </nav>
</header>

<main>

  <section style="padding-bottom:110px;">
    <div class="wrap contact-grid">
      <div>
        <span class="eyebrow mono">CONTACT</span>
        <h2>お問い合わせ</h2>
        <p>企画段階からのご相談、お見積りのご依頼など、内容にかかわらずご連絡ください。通常2営業日以内にご返信いたします。</p>

        <div class="info-row"><span class="mono">MAIL</span><span>serotonin1618@gmail.com</span></div>
        <div class="info-row"><span class="mono">SNS</span><span>Instagram @serot.prod</span></div>
        <div class="info-row"><span class="mono">BASE</span><span>東京都</span></div>
      </div>

      <form action="https://formsubmit.co/serotonin1618@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="【HPより】お問い合わせがありました">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="thanks.html">
        <input type="text" name="_honey" style="display:none">

        <div class="field">
          <label>お名前 / ブランド名</label>
          <input type="text" name="お名前" placeholder="山田 太郎" required>
        </div>
        <div class="field">
          <label>メールアドレス</label>
          <input type="email" name="メールアドレス" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label>ご相談内容</label>
          <select name="ご相談内容">
            <option>企画提案</option>
            <option>デザイン</option>
            <option>加工</option>
            <option>生産進行管理</option>
            <option>フルパッケージ</option>
            <option>REWORK(個人の服のリメイク)</option>
            <option>まだ決まっていない</option>
          </select>
        </div>
        <div class="field">
          <label>メッセージ</label>
          <textarea name="メッセージ" placeholder="作りたいもののイメージや、ご予算感などをお聞かせください。"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">送信する</button>
      </form>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <div class="logo"><span class="hole"></span>Serotonin Production</div>
    <span class="mono">© 2026 Serotonin Production. ALL RIGHTS RESERVED.</span>
  </div>
</footer>

</body>
</html>
